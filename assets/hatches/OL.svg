<svg 
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="https://www.w3.org/1999/xlink"
    width="104" 
    height="93"
>
<g transform="scale(0.38)" id="scale">
<defs>
<pattern id="p" patternUnits="userSpaceOnUse" width="104" height="93">

<line x1="1" x2="1" y1="0" y2="94" stroke="black" stroke-width="2"/>
<line x1="1" x2="25" y1="10" y2="10" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="50" x2="104" y1="10" y2="10" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="15" x2="60" y1="21" y2="21" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="1" x2="25" y1="32" y2="32" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="50" x2="104" y1="32" y2="32" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="15" x2="60" y1="43" y2="43" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="1" x2="25" y1="54" y2="54" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="50" x2="104" y1="54" y2="54" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="15" x2="60" y1="65" y2="65" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="1" x2="25" y1="76" y2="76" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="50" x2="104" y1="76" y2="76" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="15" x2="60" y1="87" y2="87" stroke="black" stroke-width="2" stroke-dasharray="4 1" />
<line x1="103" x2="103" y1="0" y2="94" stroke="black" stroke-width="2"/>
</pattern>

</defs>

<rect width="100%" height="100%" fill="url(#p)" id="rect" padding="0" margin="0" font-size="0" />

</g>
<script type="text/javascript">
let params = new URL(document.location.toString()).searchParams;
let scale_val = params.get('scale');
const scale = document.getElementById('scale');
const rect = document.getElementById('rect');
scale.setAttribute("transform","scale(" + scale_val + ")");
rect.setAttribute("height",100/scale_val + "%");
rect.setAttribute("width",100/scale_val +"%");
</script>

</svg>