
<svg 
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="https://www.w3.org/1999/xlink"
    width="104" 
    height="93"
>
<g transform="scale(0.38)" id="scale">

<defs>
<pattern id="p" patternUnits="userSpaceOnUse" width="104" height="93">

<line x1="1" x2="1" y1="0" y2="94" stroke="black" stroke-width="2"/>

<line x1="25" x2="75" y1="30" y2="30" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="32" x2="26" y1="25" y2="16" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="41" x2="37" y1="22" y2="12" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="50" x2="50" y1="20" y2="10" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="59" x2="63" y1="22" y2="12" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="68" x2="74" y1="25" y2="16" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />

<line x1="0" x2="25" y1="80" y2="80" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="5" x2="5" y1="70" y2="60" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="14" x2="18" y1="72" y2="62" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="23" x2="29" y1="75" y2="66" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />

<line x1="75" x2="104" y1="80" y2="80" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="95" x2="95" y1="70" y2="60" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="86" x2="82" y1="72" y2="62" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />
<line x1="77" x2="71" y1="75" y2="66" stroke="black" stroke-width="2" fill="transparent" stroke-dasharray="4 1" />


<line x1="103" x2="103" y1="0" y2="94" stroke="black" stroke-width="2"/>

</pattern>

</defs>

<rect width="100%" height="100%" fill="url(#p)" id="rect" padding="0" margin="0" font-size="0" />

</g>
<script type="text/javascript">
let params = new URL(document.location.toString()).searchParams;
let scale_val = params.get('scale');
const scale = document.getElementById('scale');
const rect = document.getElementById('rect');
scale.setAttribute("transform","scale(" + scale_val + ")");
rect.setAttribute("height",100/scale_val + "%");
rect.setAttribute("width",100/scale_val +"%");
</script>
</svg>
